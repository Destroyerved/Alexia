[package]
name = "alexia"
version = "3.0.0"
edition = "2021"
description = "Alexia Autonomous DevSecOps Guardian — Pure-Rust WAF Gateway, Runtime Supervisor, Multi-Agent Engine, Embedded React 19 Control Plane & Ratatui TUI"
license = "MIT"
repository = "https://github.com/Destroyerved/Alexia"

[[bin]]
name = "alexia"
path = "src/main.rs"

[dependencies]
# Async Runtime & Web / Reverse-Proxy Stack
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
axum = { version = "0.7", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream"] }

# Serialization, Config & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
clap = { version = "4.5", features = ["derive", "env"] }
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
once_cell = "1.20"
parking_lot = "0.12"
dashmap = "6.1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Pure-Rust ACID Embedded Database & SQL AST Parser (Zero C compiler required)
redb = "2.4"
sqlparser = "0.53"

# Pure-Rust Cryptography (SHA-256 Audit Chain, HMAC Tokens, Scrypt, RFC 6238 TOTP, P-256 WebAuthn)
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
scrypt = "0.11"
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
data-encoding = "2.7"
uuid = { version = "1.12", features = ["v4"] }

# Pure-Rust Process/Host Telemetry, Tarball Releases, Unified Diffs & Embedded React 19 SPA
sysinfo = "0.33"
tar = "0.4"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
similar = "2.7"
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
mime_guess = "2.0"
open = "5.3"

# Interactive Terminal UI (Ratatui)
ratatui = "0.29"
crossterm = "0.28"

[target.'cfg(windows)'.dependencies]
winapi-x86_64-pc-windows-gnu = "0.4"

[dev-dependencies]
tempfile = "3.15"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
