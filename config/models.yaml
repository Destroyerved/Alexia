# Alexia Multi-Provider LLM Routing Configuration
# Supports: openai, gemini, anthropic, openrouter, nebius, ollama, or custom OpenAI-compatible endpoints.
# Set ALEXIA_LLM_PROVIDER=auto (default) to auto-detect from configured API keys or local Ollama.

default_provider: "auto"

providers:
  openai:
    base_url: "https://api.openai.com/v1"
    env_key: "OPENAI_API_KEY"
    models:
      nano:
        id: "gpt-4o-mini"
        pricing: { input_per_million: 0.15, output_per_million: 0.60 }
      super:
        id: "gpt-4o"
        pricing: { input_per_million: 2.50, output_per_million: 10.00 }
      ultra:
        id: "o3-mini"
        pricing: { input_per_million: 1.10, output_per_million: 4.40 }

  gemini:
    base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
    env_key: "GEMINI_API_KEY"
    models:
      nano:
        id: "gemini-2.5-flash"
        pricing: { input_per_million: 0.15, output_per_million: 0.60 }
      super:
        id: "gemini-2.5-pro"
        pricing: { input_per_million: 1.25, output_per_million: 10.00 }
      ultra:
        id: "gemini-2.5-pro"
        pricing: { input_per_million: 1.25, output_per_million: 10.00 }

  anthropic:
    base_url: "https://api.anthropic.com/v1/messages"
    env_key: "ANTHROPIC_API_KEY"
    models:
      nano:
        id: "claude-3-5-haiku-latest"
        pricing: { input_per_million: 0.80, output_per_million: 4.00 }
      super:
        id: "claude-sonnet-4-20250514"
        pricing: { input_per_million: 3.00, output_per_million: 15.00 }
      ultra:
        id: "claude-sonnet-4-20250514"
        pricing: { input_per_million: 3.00, output_per_million: 15.00 }

  openrouter:
    base_url: "https://openrouter.ai/api/v1"
    env_key: "OPENROUTER_API_KEY"
    models:
      nano:
        id: "openai/gpt-4o-mini"
        pricing: { input_per_million: 0.15, output_per_million: 0.60 }
      super:
        id: "anthropic/claude-3.5-sonnet"
        pricing: { input_per_million: 3.00, output_per_million: 15.00 }
      ultra:
        id: "deepseek/deepseek-r1"
        pricing: { input_per_million: 0.55, output_per_million: 2.19 }

  nebius:
    base_url: "https://api.tokenfactory.nebius.com/v1/"
    env_key: "NEBIUS_API_KEY"
    models:
      nano:
        id: "nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B"
        pricing: { input_per_million: 0.06, output_per_million: 0.24 }
      super:
        id: "nvidia/nemotron-3-super-120b-a12b"
        pricing: { input_per_million: 0.30, output_per_million: 0.90 }
      ultra:
        id: "nvidia/Nemotron-3-Ultra-550b-a55b"
        pricing: { input_per_million: 1.00, output_per_million: 3.00 }

  ollama:
    base_url: "http://127.0.0.1:11434/v1"
    env_key: ""
    models:
      nano:
        id: "qwen2.5-coder:7b"
        pricing: { input_per_million: 0.0, output_per_million: 0.0 }
      super:
        id: "qwen2.5-coder:14b"
        pricing: { input_per_million: 0.0, output_per_million: 0.0 }
      ultra:
        id: "qwen2.5-coder:32b"
        pricing: { input_per_million: 0.0, output_per_million: 0.0 }

escalation:
  nano_confidence_threshold: 0.70
  max_super_fix_retries: 2
  escalate_to_ultra_on_verify_fail: true
  ultra_fail_escalates_to_human: true

budget:
  daily_token_cap: 5000000
  daily_usd_cap: 10.00
