services:
  alexia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alexia-guardian
    restart: unless-stopped
    ports:
      - "8080:8080" # Control Plane REST/SSE + Embedded React 19 Dashboard & Mobile PWA
      - "8000:8000" # Standalone Inline Reverse-Proxy WAF Gateway
    env_file:
      - path: .env
        required: false
    environment:
      ALEXIA_ENV: production
      ALEXIA_HOST: 0.0.0.0
      ALEXIA_PORT: "8080"
      ALEXIA_GATEWAY_PORT: "8000"
      ALEXIA_DATA_DIR: /var/lib/alexia/data
    volumes:
      - alexia_data:/var/lib/alexia/data
      - ./config:/opt/alexia/config:ro

volumes:
  alexia_data:
