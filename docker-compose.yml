services:
  # ---------------------------------------------------------------------------
  # 1. Alexia Core: 5 Autonomous Agents + API + SSE Dashboard / Mobile PWA
  # ---------------------------------------------------------------------------
  alexia:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alexia-core
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    ports:
      - "8080:8080"
    environment:
      # The container is always a production runtime: simulated health and
      # unsigned webhooks stay disabled even when the host .env is for local dev.
      - ALEXIA_ENV=production
      - ALEXIA_DATA_DIR=/app/data
      - ALEXIA_COLLECTORS=on
      - ALEXIA_DOCKER_EVENTS=on
      - ALEXIA_ALLOW_SIMULATED_HEALTH=0
      - ALEXIA_ALLOW_UNSIGNED_WEBHOOKS=0
      - NEBIUS_API_KEY=${NEBIUS_API_KEY}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_REPO=${GITHUB_REPO:-Sam-bot-dev/Alexia}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:?set GITHUB_WEBHOOK_SECRET in .env}
      - ALEXIA_SECRET_KEY=${ALEXIA_SECRET_KEY:?set ALEXIA_SECRET_KEY in .env}
      - SHOPLITE_URL=http://shoplite-api:8000
      - DATABASE_URL=sqlite:////app/data/shoplite.db
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - alexia_net
    depends_on:
      shoplite-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  # ---------------------------------------------------------------------------
  # 2. Target Application: ShopLite (FastAPI + SQLite on the shared data volume)
  # ---------------------------------------------------------------------------
  shoplite-api:
    build:
      context: ./target-app
      dockerfile: Dockerfile
    container_name: shoplite-api
    restart: unless-stopped
    init: true
    ports:
      - "8000:8000"
    environment:
      - DEMO_VULN=${DEMO_VULN:-1}
      - DATABASE_URL=sqlite:////app/data/shoplite.db
    volumes:
      - ./data:/app/data
    networks:
      - alexia_net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status == 200 else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  alexia_net:
    driver: bridge
